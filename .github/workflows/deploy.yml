name: Publicar en GitHub Pages

# El VPS (DigitalOcean) recolecta datos ADS-B 24/7 con poller.py, reconstruye el
# sitio y commitea el HTML ya generado. Este workflow NO recolecta ni commitea:
# solo toma el HTML que el VPS empuja y lo publica en GitHub Pages.

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - "*.html"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar sitio para Pages
        run: |
          mkdir -p public
          cp index.html mapa_vivo.html reporte_movimientos.html estadisticas.html ayuda.html public/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
